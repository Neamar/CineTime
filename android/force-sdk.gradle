subprojects {
    afterEvaluate { project ->
        // Si le sous-projet est un plugin Flutter (librairie Android)
        if (project.plugins.hasPlugin('com.android.library')) {
            project.android {
                // On écrase brutalement sa version pour l'aligner sur votre app
                compileSdkVersion 36

                // Idem pour Java/Kotlin : amplitude_flutter force jvmTarget 1.8 côté Kotlin
                // alors que AGP laisse Java à 11 -> "Inconsistent JVM-target compatibility"
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
            }
        }
    }
}
